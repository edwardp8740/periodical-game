          totalCoins: 0,
          levelsCleared: 0,

        const pool = FALLBACK_QUESTIONS.filter((question) => question.levelId === levelId);
        return pool[Math.floor(Math.random() * pool.length)];
      }

      async function fetchQuestion(levelId) {
        try {
          const response = await fetch(`${API_BASE}/api/questions?level=${levelId}`);

          if (!response.ok) {
            throw new Error("Question API returned an error.");
          }

          const question = await response.json();
          question.fromApi = true;
          return question;
        } catch (error) {
          const fallback = pickFallbackQuestion(levelId);
          return { ...fallback, fromApi: false };
        }
      }

        if (!question.fromApi) {
          const fallback = FALLBACK_QUESTIONS.find((item) => item.id === question.id);
          return {
            correct: fallback.answerIndex === choiceIndex,
            correctIndex: fallback.answerIndex,
            explanation: fallback.explanation,
          };
        }

        try {
          const response = await fetch(`${API_BASE}/api/answer`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              questionId: question.id,
              choiceIndex,
            }),
          });

          if (!response.ok) {
            throw new Error("Answer API returned an error.");
          }

          return response.json();
        } catch (error) {
          const fallback = FALLBACK_QUESTIONS.find((item) => item.id === question.id);
          return {
            correct: fallback.answerIndex === choiceIndex,
            correctIndex: fallback.answerIndex,
            explanation: fallback.explanation,
          };
        }
      }

      function askChemQuestion(levelId) {
        pauseForQuiz(true);

        return new Promise(async (resolve) => {
          const question = await fetchQuestion(levelId);

          quizLabel.textContent = question.fromApi ? "AP Chemistry Gate" : "AP Chemistry Gate - offline questions";
          quizQuestion.textContent = question.prompt;
          quizFeedback.textContent = "";
          quizFeedback.className = "quiz-feedback";
          quizChoices.innerHTML = "";

          question.choices.forEach((choice, index) => {
            const button = document.createElement("button");
            button.type = "button";
            button.className = "quiz-choice";
            button.textContent = `${String.fromCharCode(65 + index)}. ${choice}`;

            button.addEventListener("click", async () => {
              const buttons = [...quizChoices.querySelectorAll("button")];
              buttons.forEach((item) => {
                item.disabled = true;
              });

              const result = await checkAnswer(question, index);

              if (result.correct) {
                quizFeedback.className = "quiz-feedback correct";
                quizFeedback.textContent = `Correct. ${result.explanation}`;

                window.setTimeout(() => {
                  quizOverlay.classList.add("hidden");
                  pauseForQuiz(false);
                  resolve({ correct: true, explanation: result.explanation });
                }, 900);

                return;
              }

              quizFeedback.className = "quiz-feedback wrong";
              quizFeedback.textContent = `Not quite. ${result.explanation} Try again to unlock the gate.`;

              window.setTimeout(() => {
                buttons.forEach((item) => {
                  item.disabled = false;
                });
              }, 800);
            });

            quizChoices.appendChild(button);
          });

          quizOverlay.classList.remove("hidden");
          const firstChoice = quizChoices.querySelector("button");

          if (firstChoice) {
            firstChoice.focus();
          }
        });
      }

      function makePlatform(data, level, registry) {
        const platformColor = data.type === "fake" ? [99, 102, 241] : [30, 64, 91];
        const platform = add([
          rect(data.w, data.h),
          pos(data.x, data.y),
          area(),
          body({ isStatic: true }),
          color(...platformColor),
          outline(2, rgb(...level.accent)),
          "platform",
          {
            id: data.id || "",
            type: data.type || "normal",
            falling: false,
            sliding: false,
            targetX: data.x,
          },
        ]);

        if (data.id) {
          registry[data.id] = platform;
        }

        if (data.type === "falling") {
          platform.tag("fallingPlatform");
        }

        if (data.type === "fake") {
          platform.tag("fakePlatform");
        }

        platform.onUpdate(() => {
          if (platform.falling) {
            platform.move(0, 420);
          }

          if (platform.sliding) {
            const direction = platform.pos.x < platform.targetX ? 1 : -1;
            platform.move(direction * 155, 0);

            if (Math.abs(platform.pos.x - platform.targetX) < 6) {
              platform.pos.x = platform.targetX;
              platform.sliding = false;
            }
          }

          if (platform.pos.y > 760) {
            destroy(platform);
          }
        });

        return platform;
      }

      function makeAcidPool(data) {

      function makeMovingHazard(data) {
        const hazard = add([
          rect(data.w, data.h),
          pos(data.x, data.y),
          area(),
          color(248, 113, 113),
          outline(2, rgb(127, 29, 29)),
          "hazard",
          {
            baseX: data.x,
            baseY: data.y,
            axis: data.axis,
            range: data.range,
            speed: data.speed,
            phase: 0,
            hazardName: "moving acid ion",
          },
        ]);

        hazard.onUpdate(() => {
          hazard.phase += dt() * hazard.speed;
          const offset = Math.sin(hazard.phase) * hazard.range;

          if (hazard.axis === "x") {
            hazard.pos.x = hazard.baseX + offset;
          } else {
            hazard.pos.y = hazard.baseY + offset;
          }
        });

        return hazard;
      }

      scene("game", (levelId = 1, campaign = makeCampaign()) => {

        level.hazards.forEach(makeAcidPool);

        ]);

        const objectiveHud = add([
          text("", { size: 16, width: 420, align: "right" }),
          pos(width() - 450, 24),
          fixed(),
          color(226, 232, 240),
          z(100),
        ]);

        function updateHud() {
          const seconds = Math.max(0, Math.floor(time() - state.startTime));
          hud.text = `Coins: ${state.levelCoins}  Score: ${state.levelScore}  Time: ${seconds}s`;
          objectiveHud.text = `Objective: ${state.hasObjective ? "collected" : level.objectiveText} | Quiz: ${state.quizAnswered ? "passed" : "locked"}`;
        }

        function lose(reason) {
          if (state.dead) {
            return;
          }

          state.dead = true;
          go("gameOver", {
            levelId: level.id,
            reason,
            campaign,
            coins: state.levelCoins,
            score: state.levelScore,
          });
        }

        function completeLevel() {
          const timeBonus = Math.max(0, 120 - Math.floor(time() - state.startTime)) * 5;
          const levelBonus = 500 + timeBonus + state.levelScore;
          campaign.totalScore += levelBonus;
          campaign.totalCoins += state.levelCoins;
          campaign.levelsCleared = Math.max(campaign.levelsCleared, level.id);

          unlockNextLevel(level.id, campaign.totalScore);
          saveScore(campaign);

          if (level.id >= LEVELS.length) {
            campaign.completed = true;
            saveScore(campaign);
            go("won", campaign);
            return;
          }

          go("levelComplete", {
            level,
            campaign,
            levelBonus,
            nextLevelId: level.id + 1,
          });
        }

        onKeyDown("left", () => {
          if (!state.quizOpen) {
            player.move(-player.speed, 0);
            player.flipX = true;
          }
        });

        onKeyDown("a", () => {
          if (!state.quizOpen) {
            player.move(-player.speed, 0);
            player.flipX = true;
          }
        });

        onKeyDown("right", () => {
          if (!state.quizOpen) {
            player.move(player.speed, 0);
            player.flipX = false;
          }
        });

        onKeyDown("d", () => {
          if (!state.quizOpen) {
            player.move(player.speed, 0);
            player.flipX = false;
          }
        });

        function jump() {
          if (!state.quizOpen && player.isGrounded()) {
            player.jump(player.jumpPower);
          }
        }

        onKeyPress("space", jump);
        onKeyPress("up", jump);
        onKeyPress("w", jump);

        player.onCollide("coin", (coin) => {
          destroy(coin);
          state.levelCoins += 1;
          state.levelScore += 100;
          updateHud();
        });

        player.onCollide("objective", (objective) => {
          destroy(objective);
          destroyAll("objectiveLabel");
          state.hasObjective = true;
          state.levelScore += 350;
          makeToast(`${level.objectiveText} collected.`);
          updateHud();
        });

        player.onCollide("hazard", (hazard) => {
          if (!state.quizOpen) {
            lose(`You hit a ${hazard.hazardName || "lab hazard"}.`);
          }
        });

        player.onCollide("fallingPlatform", (platform) => {
          if (!platform.falling) {
            platform.falling = true;
            makeToast("This platform is dissolving.");
          }
        });

        player.onCollide("fakePlatform", (platform) => {
          if (!platform.falling) {
            platform.falling = true;
            platform.color = rgb(190, 18, 60);
            makeToast("That platform was not on the lab safety contract.");
          }
        });

        player.onCollide("trap", (trap) => {
          if (trap.triggered) {
            return;
          }
          
          trap.triggered = true;

          if (trap.message) {
            makeToast(trap.message);
          }

          if (trap.type === "drop") {
            spawnDrop(trap);
          }

          if (trap.type === "pop") {
            spawnPopHazard(trap);
          }

          if (trap.type === "slide" && trap.registry[trap.targetId]) {
            const target = trap.registry[trap.targetId];
            target.targetX = target.pos.x + trap.dx;
            target.sliding = true;
          }
        });

        player.onCollide("quizGate", async () => {
          if (state.quizAnswered || state.quizOpen) {
            return;
          }

          state.quizOpen = true;
          const result = await askChemQuestion(level.id);
          state.quizOpen = false;

          if (result.correct) {
            state.quizAnswered = true;
            state.levelScore += 250;
            destroy(quizGate);
            destroyAll("quizGateLabel");
            makeToast("Gate unlocked. Chemistry handled.");
            updateHud();
          }
        });

        player.onCollide("exit", () => {
          if (!state.hasObjective) {
            makeToast(`Grab the ${level.objectiveText} before exiting.`);
            player.pos.x -= 80;
            return;
          }

          if (!state.quizAnswered) {
            makeToast("Answer the AP Chem gate before exiting.");
            player.pos.x -= 80;
            return;
          }

          completeLevel();
        });

        onKeyPress("escape", () => {
          go("menu");
        });

        player.onUpdate(() => {
          camPos(
            Math.max(width() / 2, Math.min(player.pos.x, level.worldWidth - width() / 2)),
            height() / 2,
          );

          if (player.pos.y > 720) {
            lose("You fell below the lab floor.");
          }

          updateHud();
        });

        updateHud();
        makeToast("Collect electrons, grab the objective, and unlock the AP Chem gate.");

      scene("gameOver", ({ levelId, reason, campaign, coins, score }) => {
        addMenuBackground();
        addTitle("Game Over", reason || "A lab hazard ended the run.");

        add([
          text(`Level coins: ${coins}\nLevel score: ${score}`, { size: 24, width: 600, align: "center" }),
          pos(center().x, 240),
          anchor("center"),
          color(248, 250, 252),
        ]);

        addButton("Retry Level", 340, () => go("game", levelId, campaign));
        addButton("Level Select", 410, () => go("levelSelect"));
        addButton("Menu", 480, () => go("menu"), { width: 230 });
      });

      scene("won", (campaign) => {
        addMenuBackground();
        addTitle("You Won", "You survived the AP Chem platform lab.");

        add([
          text(`Final score: ${campaign.totalScore}\nCoins collected: ${campaign.totalCoins}\nLevels cleared: ${campaign.levelsCleared}`, {
            size: 26,
            width: 720,
            align: "center",
          }),
          pos(center().x, 235),
          anchor("center"),
          color(248, 250, 252),
        ]);

        addButton("Play Again", 360, () => go("game", 1, makeCampaign()));
        addButton("High Scores", 430, () => go("scores"));
        addButton("Menu", 500, () => go("menu"), { width: 230 });
      });

      go("menu");
    })();
  </script>
</body>
</html>
